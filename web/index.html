<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Threshold</title>
  <style>
    :root {
      --bg: #f6f5f2; --surface: #ffffff; --surface-2: #f0eee9; --border: #e2ded6;
      --text: #1d1c1a; --muted: #6b6760; --accent: #2f6f5e; --accent-text: #ffffff;
      --user: #e6f0ec; --ok: #2f7a4f; --warn: #b26b00; --bad: #b3261e; --info: #3d5a99;
      --code-bg: #f3f1ec; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #151513; --surface: #1e1d1b; --surface-2: #262522; --border: #34322e;
        --text: #ecebe7; --muted: #a29e96; --accent: #6fbfa6; --accent-text: #0f1a16;
        --user: #233630; --ok: #6cc28f; --warn: #e2a44a; --bad: #f08a80; --info: #93aee8;
        --code-bg: #191816; --shadow: none; color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #151513; --surface: #1e1d1b; --surface-2: #262522; --border: #34322e;
      --text: #ecebe7; --muted: #a29e96; --accent: #6fbfa6; --accent-text: #0f1a16;
      --user: #233630; --ok: #6cc28f; --warn: #e2a44a; --bad: #f08a80; --info: #93aee8;
      --code-bg: #191816; --shadow: none; color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    button, input { font: inherit; color: inherit; }
    header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 20px;
             border-bottom: 1px solid var(--border); background: var(--surface); }
    header h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
    header .sub { color: var(--muted); font-size: 13px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
            background: var(--surface-2); border: 1px solid var(--border); font-size: 12px; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.on { background: var(--ok); } .dot.off { background: var(--bad); }
    #conn { margin-left: auto; }
    .router-select { border: 0; background: transparent; color: var(--text); font-size: 12px; padding: 0 2px; }
    #router-note { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding: 16px 20px 90px;
           max-width: 1200px; margin: 0 auto; }
    @media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 12px 16px 90px; } }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
    .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 10px; }
    .pad { padding: 14px 16px; }

    #chat { display: flex; flex-direction: column; min-height: 60vh; }
    #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;
           max-height: calc(100vh - 290px); min-height: 280px; }
    @media (max-width: 860px) { #log { max-height: none; } }
    .msg { max-width: 88%; padding: 10px 13px; border-radius: 12px; }
    .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 4px; }
    .msg.err { border-left: 3px solid var(--bad); }
    .msg .tool { display: inline-block; font: 11px/1.4 ui-monospace, Consolas, monospace; color: var(--muted);
                 margin-bottom: 4px; }
    .msg img { display: block; width: 100%; max-width: 560px; border-radius: 8px; margin-top: 8px; }
    .msg .caption { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .msg ul { margin: 6px 0 0; padding-left: 18px; }
    .msg .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .pending { color: var(--muted); font-style: italic; }
    .ladder { list-style: none; padding: 0; margin: 8px 0 0; font-size: 13px; }
    .ladder li { padding: 3px 0 3px 14px; border-left: 2px solid var(--border); position: relative; }
    .ladder li::before { content: ""; position: absolute; left: -5px; top: 9px; width: 8px; height: 8px; border-radius: 50%;
                         background: var(--warn); }
    .ladder li.resolved::before { background: var(--ok); }
    .ladder .t { font-variant-numeric: tabular-nums; color: var(--muted); margin-right: 6px; }

    form#ask { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
    form#ask input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
                     background: var(--bg); }
    .btn { padding: 9px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
           cursor: pointer; white-space: nowrap; }
    .btn:hover { background: var(--surface-2); }
    .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    .btn.danger { border-color: var(--bad); color: var(--bad); }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #suggest { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 12px 12px; }
    #suggest button { font-size: 13px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--border);
                      background: transparent; cursor: pointer; color: var(--muted); }
    #suggest button:hover { color: var(--text); background: var(--surface-2); }

    aside { display: flex; flex-direction: column; gap: 16px; }
    .prompt { font-size: 17px; margin: 0 0 12px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .state { display: inline-block; padding: 2px 10px; border-radius: 999px; font-weight: 600; font-size: 13px;
             background: var(--surface-2); }
    .state.checked_in { color: var(--ok); } .state.awaiting, .state.paused, .state.not_monitored { color: var(--info); }
    .state.missed, .state.needs_help { color: var(--bad); }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; margin-top: 10px; }
    .kv dt { color: var(--muted); } .kv dd { margin: 0; }
    .muted { color: var(--muted); font-size: 12px; }

    #drawer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--border);
              box-shadow: 0 -4px 16px rgba(0,0,0,.06); max-height: 70vh; display: flex; flex-direction: column; z-index: 5; }
    #drawer-bar { display: flex; align-items: center; gap: 12px; padding: 8px 20px; }
    #drawer-bar label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
    #traffic { overflow-y: auto; padding: 0 20px 12px; display: none; }
    #drawer.open #traffic { display: block; }
    details.rpc { border: 1px solid var(--border); border-radius: 8px; margin: 6px 0; background: var(--code-bg); }
    details.rpc summary { cursor: pointer; padding: 6px 10px; font: 12px/1.5 ui-monospace, Consolas, monospace;
                          display: flex; gap: 10px; flex-wrap: wrap; }
    details.rpc summary .s { color: var(--ok); } details.rpc summary .s.bad { color: var(--bad); }
    details.rpc pre { margin: 0; padding: 8px 10px; overflow-x: auto; font: 12px/1.45 ui-monospace, Consolas, monospace;
                      border-top: 1px solid var(--border); white-space: pre-wrap; word-break: break-word; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  </style>
</head>
<body>
  <header>
    <h1>Threshold</h1>
    <span class="sub">Alexa+ simulator · a real MCP client over Streamable HTTP</span>
    <span class="chip">
      <label for="router">Router</label>
      <select id="router" class="router-select">
        <option value="bedrock">Bedrock Converse</option>
        <option value="keywords">Keywords</option>
      </select>
      <span id="router-note"></span>
    </span>
    <span id="conn" class="chip"><span class="dot"></span><span id="conn-text">Connecting…</span></span>
    <button id="reconnect" class="btn" hidden>Reconnect</button>
  </header>

  <main>
    <section id="chat" class="card" aria-label="Caregiver conversation">
      <div id="log" role="log" aria-live="polite"></div>
      <div id="suggest">
        <button>Did Dad check in today?</button>
        <button>Can I see Dad's door?</button>
        <button>What happened today?</button>
        <button>I'm on it</button>
        <button>Pause monitoring for 2 days</button>
        <button>Carer visits Tue and Fri 11:00 to 12:00</button>
      </div>
      <form id="ask" autocomplete="off">
        <label for="q" class="sr-only">Ask Threshold</label>
        <input id="q" placeholder="Ask about Dad, e.g. “Can I see Dad's door?”" required>
        <button class="btn primary" type="submit">Ask</button>
      </form>
    </section>

    <aside>
      <section class="card pad" aria-label="Parent check-in">
        <h2>Dad's device · morning check-in</h2>
        <p class="prompt">“Good morning, how are you today?”</p>
        <div class="row">
          <button class="btn primary" data-checkin="ok">I'm OK</button>
          <button class="btn danger" data-checkin="needs_help">I need help</button>
          <button class="btn" data-checkin="no_answer">No answer</button>
        </div>
        <p class="muted">Simulates the parent answering by voice. Calls <code>record_checkin</code>.</p>
      </section>

      <section class="card pad" aria-label="Routine status">
        <h2>Today</h2>
        <div id="status"><span class="muted">Loading…</span></div>
        <p class="muted" id="status-updated"></p>
      </section>
    </aside>
  </main>

  <section id="drawer" aria-label="JSON-RPC debug">
    <div id="drawer-bar">
      <button id="drawer-toggle" class="btn" aria-expanded="false">JSON-RPC <span id="rpc-count">0</span></button>
      <label><input type="checkbox" id="show-polling"> show status polling</label>
      <span class="muted" id="session-info"></span>
    </div>
    <div id="traffic"></div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
